name: Build & Release

# Every push to main (or the development branch) builds the Windows app and publishes a GitHub release.
# The in-app "Check for updates" button reads the latest release, so pushing a change = shipping an update.
on:
  push:
    branches:
      - main
      - claude/android-emulator-windows-iron97
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: 1.0.${{ github.run_number }}

jobs:
  bridge-apk:
    name: Build PC Bridge (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build tools
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Build pcbridge.apk
        run: bash android/pcbridge/build.sh "$VERSION" "$GITHUB_WORKSPACE/out/pcbridge.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: pcbridge
          path: out/pcbridge.apk

  windows:
    name: Build Windows app & publish release
    needs: bridge-apk
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v4
        with:
          name: pcbridge
          path: bridge

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/Emulate/Emulate.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:Version=$env:VERSION -p:DebugType=none -o publish
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item bridge/pcbridge.apk publish/pcbridge.apk
          Get-ChildItem publish

      - name: Zip (used by the in-app updater)
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath Emulate-win-x64.zip -Force

      - name: Build installer
        shell: pwsh
        continue-on-error: true
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DMyAppVersion=$env:VERSION" "/DSourceDir=$pwd\publish" "/O$pwd" installer\Emulate.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = @("Emulate-win-x64.zip")
          if (Test-Path "Emulate-Setup.exe") { $files += "Emulate-Setup.exe" }
          $msg = git log -1 --pretty=%B
          $notes = "Built from ${{ github.ref_name }} @ ${{ github.sha }}`n`n$msg`n`n**Install:** download Emulate-Setup.exe (or unzip Emulate-win-x64.zip and run Emulate.exe). Existing installs update themselves from Settings > Check for updates."
          gh release create "v$env:VERSION" @files --title "Emulate $env:VERSION" --notes "$notes" --target "${{ github.sha }}"
